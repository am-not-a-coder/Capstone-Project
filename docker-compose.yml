services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
      - "0.0.0.0:5174:5173" #can remove later
    environment:
      # - VITE_APP_API_URL=http://backend:5000  
      - VITE_APP_API_URL=/api
    depends_on:
      - backend
    develop:
      watch:
      - path: ./frontend
        target: /app
        action: sync
    stdin_open: true
    tty: true

  backend:
    build: ./backend
    ports:
      - "5000:5000"
      - "0.0.0.0:5001:5000" #can remove later
      - "8888:8888"

    env_file: 
      - ./backend/.env
    develop:
      watch:
      - path: ./backend
        target: /app
        action: sync
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: udmcapstone1!
      POSTGRES_DB: capstone_local_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
      image: redis:alpine
      ports:
        - '6379:6379'
      command: redis-server --appendonly yes

volumes:
  pgdata: